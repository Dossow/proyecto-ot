events {}
http {
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/ec2.crt;
        ssl_certificate_key /etc/nginx/certs/ec2.key;

        location /api/v2/ {
            proxy_pass http://influxdb:8086/api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
        }
    }
}
