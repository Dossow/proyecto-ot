# ========================================================
# INFRAESTRUCTURA CONVERGENTE OT/IT - FORTIGATE NGFW
# Modelo Purdue / IEC 62443 - Segmentacion Perimetral
# ========================================================

# --- 1. INTERFACES DE RED ---
config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http
        set type physical
        set tcp-mss 1350
        set alias "WAN_IT_CLOUD"
    next
    edit "port2"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping
        set type physical
        set tcp-mss 1350
        set alias "LAN_ZONA_OT"
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "LAN_ZONA_IT"
    next
end

# --- 2. SERVICIOS PERSONALIZADOS ---
config firewall service custom
    edit "MQTT_TCP_1883"
        set tcp-portrange 1883
    next
    edit "GRAFANA_TCP_3000"
        set tcp-portrange 3000
    next
    edit "INFLUXDB_TCP_8086"
        set tcp-portrange 8086
    next
end

# --- 3. OBJETOS DE DIRECCIONAMIENTO ---
config firewall address
    edit "ZONA_OT_SUBNET"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "ZONA_IT_SUBNET"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "HOST_PLC_CENTRAL"
        set subnet 192.168.10.10 255.255.255.255
    next
    edit "HOST_GATEWAY_BORDE_OT"
        set subnet 192.168.10.21 255.255.255.255
    next
    edit "HOST_BROKER_MQTT_IT"
        set subnet 192.168.20.20 255.255.255.255
    next
    edit "HOST_PUENTE_AWS_IT"
        set subnet 192.168.20.40 255.255.255.255
    next
    edit "all"
    next
end

# --- 4. POLITICAS DE SEGURIDAD ---
config firewall policy
    edit 1
        set name "PERMITIR_OT_A_IT_MQTT"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "HOST_GATEWAY_BORDE_OT"
        set dstaddr "HOST_BROKER_MQTT_IT"
        set action accept
        set schedule "always"
        set service "MQTT_TCP_1883"
        set logtraffic all
    next
    edit 2
        set name "PERMITIR_PUENTE_AWS_TELEMETRIA"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "HOST_PUENTE_AWS_IT"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS" "PING" "INFLUXDB_TCP_8086"
        set nat enable
        set logtraffic all
    next
    edit 3
        set name "BLOQUEAR_FUGA_DIRECTA_ZONA_OT"
        set srcintf "port2"
        set dstintf "port1" "port3"
        set srcaddr "ZONA_OT_SUBNET"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
